<style>
    #chatbot {
        max-width: 950px;
        margin: 0 auto;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #323130;
    }

    #chatMessages {
        min-height: 300px;
        max-height: 650px;
        overflow-y: auto;
        padding: 18px;
        background: #faf9f8;
        border: 1px solid #edebe9;
        border-radius: 4px;
		margin-top: 15px;
    }

    .chat-message {
        margin-bottom: 18px;
    }

    .chat-user {
        margin-left: 15%;
        padding: 12px 16px;
        background: #e5f1fb;
        border-radius: 6px;
    }

    .chat-assistant {
        margin-right: 8%;
        padding: 14px 16px;
        background: #ffffff;
        border: 1px solid #edebe9;
        border-radius: 6px;
    }

    .chat-label {
        font-weight: 600;
        margin-bottom: 7px;
    }

    .chat-answer {
        line-height: 1.55;
    }

    .chat-debug {
        margin-top: 12px;
        padding-top: 8px;
        border-top: 1px solid #edebe9;
        font-size: 11px;
        color: #797775;
    }

    .chat-sources {
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid #edebe9;
    }

    .chat-sources-title {
        font-weight: 600;
        margin-bottom: 8px;
    }

    .chat-source {
        margin-bottom: 12px;
        line-height: 1.4;
    }

    .chat-source a {
        font-weight: 600;
        text-decoration: none;
    }

    .chat-source a:hover {
        text-decoration: underline;
    }

    .chat-source-meta {
        margin-top: 2px;
        font-size: 11px;
        color: #797775;
    }

    .chat-source-snippet {
        margin-top: 4px;
        font-size: 12px;
        color: #605e5c;
    }

    #chatInputArea {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        margin-top: 12px;
    }

    #chatQuestion {
        box-sizing: border-box;
        flex: 1;
        min-height: 70px;
        padding: 10px;
        font-family: "Segoe UI", Arial, sans-serif;
        font-size: 14px;
        resize: vertical;
        border: 1px solid #8a8886;
        border-radius: 4px;
    }

    #chatQuestion:focus {
        outline: 2px solid #0078d4;
        outline-offset: -1px;
    }

    #chatAskButton {
        min-width: 90px;
        height: 38px;
        padding: 0 18px;
        border: 0;
        border-radius: 3px;
        background: #0078d4;
        color: white;
        font-family: "Segoe UI", Arial, sans-serif;
        font-weight: 600;
        cursor: pointer;
    }

    #chatAskButton:hover {
        background: #106ebe;
    }

    #chatAskButton:disabled {
        background: #c8c6c4;
        cursor: default;
    }

    #chatStatus {
        min-height: 20px;
        margin-top: 6px;
        font-size: 12px;
        color: #605e5c;
    }

    .chat-error {
        margin: 10px 0;
        padding: 10px;
        border: 1px solid #a80000;
        color: #a80000;
        background: #fde7e9;
    }
	
	.chat-feedback button {
		min-width: 38px;
		height: 30px;
		margin-left: 8px;
		padding: 2px 8px;
		cursor: pointer;
		font-size: 16px;
	}
	
	.chat-stats {
		margin-top: 0px;
		text-align: center;
		font-size: 16px;
		color: #666;
	}
	
</style>

<div id="chatbot">

    <div id="chatMessages"></div>

    <div id="chatInputArea">
        <textarea
            id="chatQuestion"
            rows="3"
            placeholder="Ask a question about content from the CalSAWS SharePoint site..."
        ></textarea>

        <button id="chatAskButton" type="button">
            Ask
        </button>
    </div>

    <div id="chatStatus"></div>
	
	<div id="chatStats" class="chat-stats"></div>

</div>

<script>
(function () {
    "use strict";

    const API_URL =
        "http://ehsddevcsweb.ehsd.ds.contra-costa.org:8000/ask";
	const FEEDBACK_URL =
		"http://ehsddevcsweb.ehsd.ds.contra-costa.org:8000/feedback";
	const STATS_URL =
		"http://ehsddevcsweb.ehsd.ds.contra-costa.org:8000/stats";
	
    const messagesElement = document.getElementById("chatMessages");
    const questionElement = document.getElementById("chatQuestion");
    const askButton = document.getElementById("chatAskButton");
    const statusElement = document.getElementById("chatStatus");

	loadStats();

    // ------------------------------------------------------------
    // HTML escaping
    // ------------------------------------------------------------

    function escapeHtml(value) {
        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // ------------------------------------------------------------
    // Display user question
    // ------------------------------------------------------------

	function addUserMessage(question) {
		const block = document.createElement("div");

		block.className = "chat-message chat-user";

		block.innerHTML =
			'<div class="chat-label">You</div>' +
			'<div>' + escapeHtml(question) + '</div>';

		messagesElement.appendChild(block);
	}

    // ------------------------------------------------------------
    // Display assistant response
    // ------------------------------------------------------------

	function addAssistantMessage(data) {
		const block = document.createElement("div");

		block.className = "chat-message chat-assistant";

		let html = "";

		html += '<div class="chat-label">Assistant</div>';

		html +=
			'<div class="chat-answer">' +
			formatAnswer(data.answer || "No answer returned.") +
			'</div>';


		// Temporary debugging information
		if (data.search_query) {
			html +=
				'<div class="chat-debug">' +
				'<strong>Search query:</strong> ' +
				escapeHtml(data.search_query) +
				'</div>';
		}


		// SharePoint search results
		if (data.results && data.results.length > 0) {

			html += '<div class="chat-sources">';

			html +=
				'<div class="chat-sources-title">' +
				'Sources (' + data.results.length + ')' +
				'</div>';

			data.results.forEach(function (result, index) {

				html += '<div class="chat-source">';

				html +=
					'<span>' +
					(index + 1) +
					'. </span>';

				if (result.path) {
					html +=
						'<a href="' +
						escapeHtml(result.path) +
						'" target="_blank" rel="noopener noreferrer">' +
						escapeHtml(result.title || result.path) +
						'</a>';
				} else {
					html +=
						escapeHtml(
							result.title || "Untitled document"
						);
				}

				html += '<div class="chat-source-meta">';

				if (result.file_type) {
					html +=
						escapeHtml(
							result.file_type.toUpperCase()
						);
				}

				if (
					result.rank !== null &&
					result.rank !== undefined &&
					result.rank !== ""
				) {
					if (result.file_type) {
						html += " | ";
					}

					html +=
						"Rank: " +
						escapeHtml(
							Number(result.rank).toFixed(2)
						);
				}

				html += '</div>';

				if (result.snippet) {
					html +=
						'<div class="chat-source-snippet">' +
						escapeHtml(
							cleanSnippet(result.snippet)
						) +
						'</div>';
				}

				html += '</div>';
			});

			html += '</div>';
		}

		block.innerHTML = html;

		messagesElement.appendChild(block);

		block.scrollIntoView({
			behavior: "smooth",
			block: "end"
		});
		
		if (data.request_id) {
			addFeedbackControls(
				block,
				data.request_id
			);
}
	}
	

    // ------------------------------------------------------------
    // Display error
    // ------------------------------------------------------------

	function addErrorMessage(error) {
		const block = document.createElement("div");

		block.className = "chat-error";

		block.textContent =
			"Sorry, the chatbot could not process your request. " +
			"Please try again later.";

		messagesElement.appendChild(block);
	}	
	
	// ------------------------------------------------------------
	// Send question to FastAPI
	// ------------------------------------------------------------

	async function askQuestion() {
		const question = questionElement.value.trim();

		if (!question) {
			return;
		}

		addUserMessage(question);

		questionElement.value = "";
		questionElement.disabled = true;
		askButton.disabled = true;

		statusElement.textContent = "Searching...";

		try {
			const response = await fetch(API_URL, {
				method: "POST",

				headers: {
					"Content-Type": "application/json"
				},

				body: JSON.stringify({
					question: question
				})
			});

			if (!response.ok) {
				throw new Error(
					"HTTP " +
					response.status +
					" " +
					response.statusText
				);
			}

			const data = await response.json();

			console.log("ChatBot response:", data);

			addAssistantMessage(data);
			
			loadStats();

		} catch (error) {
			console.error("ChatBot error:", error);

			addErrorMessage(error);

		} finally {
			statusElement.textContent = "";

			questionElement.disabled = false;
			askButton.disabled = false;

			questionElement.focus();
		}
	}


	function formatAnswer(value) {
		if (!value) {
			return "";
		}

		let text = escapeHtml(value);

		// Basic Markdown bold
		text = text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

		// Preserve line breaks
		text = text.replace(/\n/g, "<br>");

		return text;
	}


	function cleanSnippet(value) {
		if (!value) {
			return "";
		}

		let text = value;

		// Remove SharePoint search highlighting tags
		text = text.replace(/<c\d+>/gi, "");
		text = text.replace(/<\/c\d+>/gi, "");

		// Replace SharePoint hit separator with an ellipsis
		text = text.replace(/<ddd\s*\/?>/gi, " ... ");

		return text;
	}
	
	
	function addFeedbackControls(container, requestId) {

		const feedback = document.createElement("div");
		feedback.className = "chat-feedback";

		const label = document.createElement("span");
		label.textContent = "Was this answer helpful?";

		const upButton = document.createElement("button");
		upButton.type = "button";
		upButton.textContent = "\uD83D\uDC4D";
		upButton.title = "Helpful";

		const downButton = document.createElement("button");
		downButton.type = "button";
		downButton.textContent = "\uD83D\uDC4E";
		downButton.title = "Not helpful";

		feedback.appendChild(label);
		feedback.appendChild(upButton);
		feedback.appendChild(downButton);

		container.appendChild(feedback);

		upButton.addEventListener("click", function () {
			sendFeedback(
				requestId,
				"up",
				upButton,
				downButton,
				feedback
			);
		});

		downButton.addEventListener("click", function () {
			sendFeedback(
				requestId,
				"down",
				upButton,
				downButton,
				feedback
			);
		});
	}


	async function sendFeedback(
		requestId,
		value,
		upButton,
		downButton,
		container
	) {
		try {
			const response = await fetch(FEEDBACK_URL, {
				method: "POST",

				headers: {
					"Content-Type": "application/json"
				},

				body: JSON.stringify({
					request_id: requestId,
					feedback: value
				})
			});

			if (!response.ok) {
				throw new Error(
					"HTTP " +
					response.status +
					" " +
					response.statusText
				);
			}

			upButton.disabled = true;
			downButton.disabled = true;

			const message = document.createElement("span");
			message.className = "feedback-thanks";
			message.textContent = " Thank you!";

			container.appendChild(message);

		} catch (error) {
			console.error(
				"Feedback error:",
				error
			);
		}
	}


	async function loadStats() {
		try {
			const response = await fetch(STATS_URL);

			if (!response.ok) {
				throw new Error(
					"HTTP " +
					response.status +
					" " +
					response.statusText
				);
			}

			const data = await response.json();

			const statsElement =
				document.getElementById("chatStats");

			statsElement.textContent =
				data.requests +
				" requests processed so far. Let's keep them coming!";

		} catch (error) {
			console.error("Stats error:", error);
		}
	}


    // ------------------------------------------------------------
    // Events
    // ------------------------------------------------------------

    askButton.addEventListener("click", askQuestion);

    questionElement.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            askQuestion();
        }
    });

})();
</script>
